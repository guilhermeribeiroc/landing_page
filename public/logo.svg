<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer circle arc - starts top-right, goes counterclockwise ~320 degrees -->
  <path d="M 140 42 A 68 68 0 1 0 155 115" 
        stroke="white" stroke-width="10" stroke-linecap="round" fill="none"/>
  
  <!-- Inner circle arc - starts top-right, goes counterclockwise ~300 degrees -->
  <path d="M 130 60 A 45 45 0 1 0 140 105" 
        stroke="white" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Cursor / pointer arrow -->
  <polygon points="130,110 160,155 147,157 148,172 125,140" fill="white"/>
  
  <!-- Click spark lines -->
  <line x1="124" y1="102" x2="116" y2="94" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="132" y1="97" x2="128" y2="87" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="121" y1="108" x2="112" y2="105" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
